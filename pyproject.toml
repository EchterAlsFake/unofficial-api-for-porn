[build-system]
requires = ["uv_build>=0.9.30"]
build-backend = "uv_build"

[project]
name = "unofficial-api-for-porn"
version = "0.1.0"
description = "An asynchronous Python API wrapper for porn.com"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Johannes Habel", email = "EchterAlsFake@proton.me" }]
dependencies = ["eaf-base-api[hls]>=4.2.6", "selectolax"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "build"]

[project.scripts]
porn_api = "porn_api.api:main"

[tool.uv.build-backend]
module-name = "porn_api"
module-root = ""
source-include = ["README.md", "LICENSE", "MANIFEST.in"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["porn_api/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project.urls]
Documentation = "https://docs.echteralsfake.me/porn"
Repository = "https://github.com/EchterAlsFake/unofficial-api-for-porn"
